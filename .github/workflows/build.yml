
name: Build ChatPDF APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack Android project
        run: |
          mkdir -p project
          unzip -q ChatPDFExport_GitHub_Ready.zip -d project
          find project -maxdepth 3 -type f

      - name: Fix Java and Kotlin compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path("project").rglob("app/build.gradle.kts"))
          if not files:
              raise SystemExit("app/build.gradle.kts not found")

          path = files[0]
          content = path.read_text()

          if "compileOptions" not in content:
              content = content.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              """,
                  1
              )

          path.write_text(content)
          print("Updated:", path)
          PY

      - name: Build APK
        shell: bash
        run: |
          set -e
          ROOT=$(find project -name settings.gradle.kts -print -quit)
          test -n "$ROOT"
          cd "$(dirname "$ROOT")"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatPDFExport-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
